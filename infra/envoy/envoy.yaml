# Envoy Gateway & Edge Guard Configuration
# Downstream TLS Termination, Keycloak OIDC Authentication, and Proxy Routing

static_resources:
  listeners:
  - name: ingress_edge_guard
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: aegis_edge_routes
            virtual_hosts:
            - name: aegis_control_plane
              domains: ["*"]
              routes:
              - match:
                  prefix: "/health"
                route:
                  cluster: control_plane_service
              - match:
                  prefix: "/mcp"
                route:
                  cluster: control_plane_service
                  timeout: 60s
              - match:
                  prefix: "/api/v1/orchestrator"
                route:
                  cluster: control_plane_service
                  timeout: 120s
              - match:
                  prefix: "/api/v1/tools"
                route:
                  cluster: control_plane_service
                  timeout: 60s
              - match:
                  prefix: "/data"
                route:
                  cluster: data_plane_service
                  timeout: 60s
          http_filters:
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                keycloak_provider:
                  issuer: "http://keycloak.aegis.local/realms/aegis"
                  audiences:
                  - "aegis-mcp-control-plane"
                  remote_jwks:
                    http_uri:
                      uri: "http://keycloak.aegis.local/realms/aegis/protocol/openid-connect/certs"
                      cluster: keycloak_service
                      timeout: 5s
                    cache_duration: 300s
                  from_headers:
                  - name: Authorization
                    value_prefix: "Bearer "
                  payload_in_metadata: aegis_jwt_payload
              rules:
              - match:
                  prefix: "/health"
              - match:
                  prefix: "/api/v1/tools"
                  requires:
                    provider_name: keycloak_provider
              - match:
                  prefix: "/mcp"
                  requires:
                    provider_name: keycloak_provider
              - match:
                  prefix: "/api/v1/orchestrator"
                  requires:
                    provider_name: keycloak_provider
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: control_plane_service
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: control_plane_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: aegis-control-plane.aegis.svc.cluster.local
                port_value: 8000

  - name: data_plane_service
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: data_plane_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: aegis-data-plane.aegis.svc.cluster.local
                port_value: 8001

  - name: keycloak_service
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: keycloak_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: keycloak.aegis.svc.cluster.local
                port_value: 8080
