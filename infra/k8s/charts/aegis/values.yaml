# Default values for Aegis MCP Control Plane & Sandboxes Helm Chart.

global:
  environment: "production"
  region: "us-central1"
  cloudProvider: "gcp" # gcp, aws, or kind

controlPlane:
  replicaCount: 2
  image:
    repository: aegis/control-plane
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    OIDC_ENABLED: "true"
    OIDC_ALGORITHM: "RS256"
    DATA_PLANE_URL: "http://aegis-data-plane:8001"
    DATA_PLANE_TIMEOUT_SECONDS: "30.0"

dataPlane:
  replicaCount: 3
  image:
    repository: aegis/data-plane
    tag: latest
    pullPolicy: IfNotPresent
  runtimeClassName: "gvisor"
  service:
    type: ClusterIP
    port: 8001
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  env:
    SANDBOX_TIMEOUT_SECONDS: "30.0"
    ARM_TOOLS_DIR: "/app/examples/tools"

envoy:
  enabled: true
  replicaCount: 2
  image:
    repository: envoyproxy/envoy
    tag: v1.31-latest
  service:
    type: LoadBalancer
    port: 80
    targetPort: 8080

cnpgPostgres:
  enabled: true
  instances: 2
  storage:
    size: 20Gi
  pgvector:
    enabled: true
