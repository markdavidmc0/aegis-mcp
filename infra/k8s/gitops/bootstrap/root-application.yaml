apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-root-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/markdavidmc0/aegis-mcp-control-plane.git
    targetRevision: HEAD
    path: infra/k8s/gitops/overlays/prod-gcp
  destination:
    server: https://kubernetes.default.svc
    namespace: aegis-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
