name: Dual-Gate CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-dual-gate:
    name: Python Verifier & Linter Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: uv sync --frozen

    - name: Run Ruff Linter Gate
      run: uv run ruff check src/ tests/

    - name: Run Pytest Verifier Gate
      run: uv run pytest --maxfail=1 --disable-warnings -v

  opa-policy-gate:
    name: OPA / Rego Policy Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup OPA
      uses: open-policy-agent/setup-opa@v2
      with:
        version: "latest"

    - name: Check and Test Policies
      run: |
        opa check policies/
        opa test policies/ -v
